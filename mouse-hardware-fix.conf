# Global configuration for mouse-hardware-fix.
# After editing, apply with:  sudo systemctl restart 'mouse-hardware-fix@*'
#
# Flags for EXTRA_ARGS:
#   --only <vid:pid>          Only fix this mouse (hex IDs from `lsusb`, repeatable).
#                             Without it, every physical mouse is handled.
#   --disable-scroll          Turn off the scroll wheel fix.
#   --disable-click           Turn off the click chatter fix.
#   --scroll-timeout <sec>    Pause that ends a scroll gesture; after it, any
#                             direction is accepted immediately. (default 0.300)
#   --scroll-reversal <n>     Notches the wheel must keep turning the other way
#                             mid-gesture before it counts as a real reversal. (default 2)
#   --scroll-drop             Drop bounced wheel steps instead of inverting them.
#   --click-timeout <sec>     Chatter window for buttons. (default 0.025)
#   --verbose                 Log every corrected event (journalctl -u 'mouse-hardware-fix@*').
#
# Example: EXTRA_ARGS="--only 046d:c08b --click-timeout 0.030"

EXTRA_ARGS=""
